name: Bug report / Сообщить об ошибке
description: Report a reproducible layout correction or settings problem / Описать воспроизводимую ошибку
body:
  - type: markdown
    attributes:
      value: "Use invented text only. Do not include messages, passwords, logs with personal data, or screenshots of private conversations. / Используйте только вымышленные примеры."
  - type: input
    id: version
    attributes:
      label: Trump Switcher version / Версия
      placeholder: "0.6.47 (86)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and chip (Apple Silicon or Intel) / macOS и процессор (Apple Silicon или Intel)
    validations:
      required: true
  - type: input
    id: editor
    attributes:
      label: Application and text-field type / Приложение и тип поля
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps using synthetic text / Шаги с вымышленным текстом
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result / Ожидание и результат
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Technical information / Техническая информация
      description: "Optional: Settings → Advanced → Help → Technical information. It contains counters, not typed words. Review it before posting. / Необязательно: Настройки → Дополнительно → Помощь → Техническая информация. Там счётчики, а не набранные слова. Проверьте текст перед публикацией."
